<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Sistema de Inventario</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <h1>Inventario API</h1>
      <p>Accede con tus credenciales de usuario</p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" class="form-control" placeholder="Ej: admin" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn">Ingresar</button>
      </form>

      <!-- Div para renderizado dinamico de errores -->
      <div id="error-message" class="alert alert-danger hidden"></div>
    </div>
  </div>

  <script src="js/login.js" defer></script>
</body>
</html>
